name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    uses: ./.github/workflows/checks.yml

    with:
      python-version: ${{ matrix.python-version }}

    secrets:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
